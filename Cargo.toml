[package]
name = "holm-bar"
version = "0.2.0"
edition = "2021"
description = "Menu bar, notch (dynamic island), dan Dock bergaya macOS untuk Windows"
repository = "https://github.com/fahrilshaputraa/holm"

# Installer (HolmBar-Setup.exe) adalah crate terpisah; `cargo build` biasa hanya membangun aplikasinya.
[workspace]
members = [".", "installer"]
default-members = ["."]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_DataExchange",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Media_Control",
    "Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_WinRT",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Devices_Radios",
    "Devices_Enumeration",
    "Devices_Bluetooth",
    "Foundation_Collections",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Storage_Streams",
    "Win32_Networking_WinHttp",
    "Win32_Media_Audio",
    "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Registry",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Win32_Storage_Packaging_Appx"
] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-collections = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
