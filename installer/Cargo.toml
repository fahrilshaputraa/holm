[package]
name = "holm-setup"
version = "0.2.0"
edition = "2021"
description = "Installer HolmBar (pasang per pengguna, tanpa hak administrator)"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "HolmBar-Setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
